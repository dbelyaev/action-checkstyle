name: depup

on:
  schedule:
    - cron: "14 14 * * *" # Runs at 14:14 UTC every day
  repository_dispatch:
    types: [ depup ]
  workflow_dispatch:

# set empty default permissions and define them explicitly in each job for security
permissions: {}

jobs:

  reviewdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: write # to create/update PRs with dependency updates (peter-evans/create-pull-request)
      contents: write # to checkout repository and commit/push version changes to branches

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-depup@a03fa2103b273193becba8cca43a992b9173f5dc # v1.6.7
        id: depup
        with:
          file: Dockerfile
          version_name: REVIEWDOG_VERSION
          repo: reviewdog/reviewdog

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "chore(deps): update reviewdog to ${{ steps.depup.outputs.latest }}"
          commit-message: "chore(deps): update reviewdog to ${{ steps.depup.outputs.latest }}"
          body: |
            Update reviewdog to [v${{ steps.depup.outputs.latest }}](https://github.com/reviewdog/reviewdog/releases/tag/v${{ steps.depup.outputs.latest }})
            Compare [v${{ steps.depup.outputs.current }}...v${{ steps.depup.outputs.latest }}](https://github.com/reviewdog/reviewdog/compare/v${{ steps.depup.outputs.current }}...v${{ steps.depup.outputs.latest }})

            This PR is auto generated by [depup workflow](https://github.com/${{ github.repository }}/actions?query=workflow%3Adepup).
          branch: depup/reviewdog
          base: master
          labels: "bump:minor"
          sign-commits: true

  checkstyle:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: write # to create/update PRs with dependency updates (peter-evans/create-pull-request)
      contents: write # to checkout repository and commit/push version changes to branches

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-depup@a03fa2103b273193becba8cca43a992b9173f5dc # v1.6.7
        id: depup-checkstyle
        with:
          file: Dockerfile
          version_name: CHECKSTYLE_VERSION
          repo: checkstyle/checkstyle

      # The Dockerfile pins the JAR by sha256; recompute it for the new
      # version so the bump lands complete instead of failing the build.
      - name: Update pinned JAR checksum
        if: steps.depup-checkstyle.outputs.latest != steps.depup-checkstyle.outputs.current
        run: bash ./scripts/update-checkstyle-checksum.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "chore(deps): update default checkstyle to ${{ steps.depup-checkstyle.outputs.latest }}"
          commit-message: "chore(deps): update default checkstyle to ${{ steps.depup-checkstyle.outputs.latest }}"
          body: |
            Update checkstyle to [v${{ steps.depup-checkstyle.outputs.latest }}](https://github.com/checkstyle/checkstyle/releases/tag/checkstyle-${{ steps.depup-checkstyle.outputs.latest }})
            Compare [v${{ steps.depup-checkstyle.outputs.current }}...v${{ steps.depup-checkstyle.outputs.latest }}](https://github.com/checkstyle/checkstyle/compare/checkstyle-${{ steps.depup-checkstyle.outputs.current }}...checkstyle-${{ steps.depup-checkstyle.outputs.latest }})

            This PR is auto generated by [depup workflow](https://github.com/${{ github.repository }}/actions?query=workflow%3Adepup).
          branch: depup/checkstyle
          base: master
          labels: "bump:minor"
          sign-commits: true
